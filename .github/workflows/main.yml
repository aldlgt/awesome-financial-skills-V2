name: Candidate discovery

on:
  schedule:
    - cron: '0 8 * * 1' # 每周一 UTC 08:00
  workflow_dispatch:
    inputs:
      topic_ids:
        description: 'Comma-separated topic ids (empty = all)'
        required: false
        default: ''
      target_per_topic:
        description: 'Quality skills to keep per topic after scoring'
        required: false
        default: '10'
      dry_run:
        description: 'Dry run (1) or apply/create PRs (0)'
        required: false
        default: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}
      TARGET_PER_TOPIC: ${{ github.event.inputs.target_per_topic || '10' }}
      TOPIC_IDS: ${{ github.event.inputs.topic_ids || '' }}
      MAX_DOWNLOADS: '80'
      PER_TOPIC_DOWNLOADS: '10'
      EXTRACT_ZIPS: '0'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Discover thematic candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_PER_TOPIC: ${{ env.TARGET_PER_TOPIC }}
          TOPIC_IDS: ${{ env.TOPIC_IDS }}
        run: python tools/fetch_candidates.py

      - name: Upload candidates JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates_json
          path: |
            candidates/all_candidates.json
            candidates/by_topic
            candidates/rejected_sample.json
          if-no-files-found: warn

      - name: Package candidate repos (zip only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_DOWNLOADS: ${{ env.MAX_DOWNLOADS }}
          PER_TOPIC_DOWNLOADS: ${{ env.PER_TOPIC_DOWNLOADS }}
          TOPIC_IDS: ${{ env.TOPIC_IDS }}
          EXTRACT_ZIPS: ${{ env.EXTRACT_ZIPS }}
        run: python tools/package_skills.py

      - name: Upload skills artifact
        uses: actions/upload-artifact@v4
        with:
          name: skills_archive
          path: artifacts/skills
          if-no-files-found: warn

      - name: Create candidate PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: python tools/create_candidate_prs.py

      - name: Apply candidates to categories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: python tools/apply_candidates.py
